<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="SentryCore">
  <title>SentryCore</title>
  <!-- Sin transparencia y sin bordes redondeados: Google Play recorta la mascara
       del launcher por su cuenta, y el icono de 512x512 de la ficha se rechaza
       si trae canal alfa. -->
  <rect width="1024" height="1024" fill="#1f3b73"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Escudo: vigilancia. -->
    <path d="M512 240 L760 320 L760 520 C760 660 656 744 512 792 C368 744 264 660 264 520 L264 320 Z"
          fill="#ffffff" fill-opacity="0.10" stroke-width="30"/>
    <!-- Ondas NFC: el gesto de acercar el telefono a la etiqueta. -->
    <path d="M455 451.4 A70 70 0 0 1 455 572.6" stroke-width="34"/>
    <path d="M480 408.1 A120 120 0 0 1 480 615.9" stroke-width="34"/>
    <path d="M505 364.8 A170 170 0 0 1 505 659.2" stroke-width="34"/>
  </g>
  <circle cx="410" cy="512" r="27" fill="#ffffff"/>
</svg>
