<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="VoxIA Control">
  <title>VoxIA Control — marca del splash</title>
  <!--
    Fondo transparente: el color lo pone `expo-splash-screen`
    (backgroundColor: #1f3b73). La marca va en blanco puro porque se dibuja
    sobre ese azul.

    Se muestra a 200 px de ancho (imageWidth en app.config.ts). No lleva texto:
    a ese tamaño "VoxIA Control" queda ilegible, y el nombre ya esta debajo del
    icono en el launcher.
  -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 240 L760 320 L760 520 C760 660 656 744 512 792 C368 744 264 660 264 520 L264 320 Z"
          fill="#ffffff" fill-opacity="0.10" stroke-width="30"/>
    <path d="M455 451.4 A70 70 0 0 1 455 572.6" stroke-width="34"/>
    <path d="M480 408.1 A120 120 0 0 1 480 615.9" stroke-width="34"/>
    <path d="M505 364.8 A170 170 0 0 1 505 659.2" stroke-width="34"/>
  </g>
  <circle cx="410" cy="512" r="27" fill="#ffffff"/>
</svg>
