name: sentrycore-production

services:
  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sentrycore_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL es obligatorio}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --ping.entrypoint=traefik
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      DATABASE_APP_USER: ${DATABASE_APP_USER:?DATABASE_APP_USER es obligatorio}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g
    shm_size: 256m
    security_opt:
      - no-new-privileges:true

  # Servicio de respaldo diario y copia remota (issue #24, docs/respaldos.md).
  postgres-backup:
    build:
      context: .
      dockerfile: docker/postgres/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Santiago}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      BACKUP_HORA: ${BACKUP_HORA:-04:00}
      BACKUP_AL_ARRANCAR: ${BACKUP_AL_ARRANCAR:-si}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MINIMO_LOCAL: ${BACKUP_MINIMO_LOCAL:-3}
      BACKUP_COPIAR_EVIDENCIA: ${BACKUP_COPIAR_EVIDENCIA:-si}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_POSTGRES: ${BACKUP_REMOTE_POSTGRES:-}
      BACKUP_REMOTE_EVIDENCIA: ${BACKUP_REMOTE_EVIDENCIA:-}
      BACKUP_ENCRYPTION_TOOL: ${BACKUP_ENCRYPTION_TOOL:-}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_OPENSSL_PASSPHRASE: ${BACKUP_OPENSSL_PASSPHRASE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:-}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE:-}
      RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-}
      RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_REGION: ${RCLONE_CONFIG_R2_REGION:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_S3_TYPE: ${RCLONE_CONFIG_S3_TYPE:-}
      RCLONE_CONFIG_S3_PROVIDER: ${RCLONE_CONFIG_S3_PROVIDER:-}
      RCLONE_CONFIG_S3_ENDPOINT: ${RCLONE_CONFIG_S3_ENDPOINT:-}
      RCLONE_CONFIG_S3_REGION: ${RCLONE_CONFIG_S3_REGION:-}
      RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${RCLONE_CONFIG_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_S3_SECRET_ACCESS_KEY:-}
    command: ["sh", "/scripts/respaldo-diario.sh"]
    volumes:
      - backup_data:/backups
      - evidence_data:/evidencia:ro
      - ./docker/postgres/backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      REDIS_URL: ${REDIS_URL:?REDIS_URL es obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      MAIL_DRIVER: ${MAIL_DRIVER:?MAIL_DRIVER es obligatorio}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM es obligatorio}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      # Dominios extra a los que no se despacha correo (#86). Los reservados por
      # norma (.test, .invalid, .example) ya vienen bloqueados de fabrica y NO
      # dependen de esta linea: sin ella la proteccion igual esta puesta.
      #
      # Va enumerada porque este `environment` es una lista explicita: una
      # variable definida en el .env del servidor y no declarada aca no llega al
      # contenedor, y el sintoma seria "la configure y no hace nada".
      #
      # MAIL_ALLOW_RESERVED_DOMAINS no se pasa: en produccion `validateEnv` la
      # rechaza con MAIL_DRIVER=smtp, asi que ofrecerla aca solo serviria para
      # que alguien la ponga y el despliegue no arranque.
      MAIL_BLOCKED_DOMAINS: ${MAIL_BLOCKED_DOMAINS:-}
      WEB_PUBLIC_URL: https://${APP_DOMAIN:?APP_DOMAIN es obligatorio}
      # La MISMA cartografia que el panel: el informe dibuja el plano del
      # recorrido sobre estos tiles. Si falta, el PDF sale igual pero con el
      # plano a escala sin fondo — nunca falla por esto.
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - evidence_data:/app/storage
    networks:
      - internal
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.sentrycore-api.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/ready`))
      - traefik.http.routers.sentrycore-api.entrypoints=websecure
      - traefik.http.routers.sentrycore-api.tls.certresolver=letsencrypt
      - traefik.http.routers.sentrycore-api.priority=100
      - traefik.http.services.sentrycore-api.loadbalancer.server.port=3001

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-(c) OpenStreetMap contributors}
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.sentrycore-web.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.sentrycore-web.entrypoints=websecure
      - traefik.http.routers.sentrycore-web.tls.certresolver=letsencrypt
      - traefik.http.services.sentrycore-web.loadbalancer.server.port=3000

networks:
  proxy:
    name: sentrycore_proxy
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  evidence_data:
  backup_data:
  letsencrypt_data:
