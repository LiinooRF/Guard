# ---------------------------------------------------------------------------
# VoxIA Control — infraestructura de desarrollo local.
#
# Levanta SOLO los servicios de apoyo: PostgreSQL, Redis y un capturador de
# correo. La API y la web se corren nativas con `npm run dev:api` y
# `npm run dev:web`.
#
# Por que no van la api y la web aca: montar node_modules por bind mount en
# Windows es lento y rompe binarios nativos. Correr las apps nativas da recarga
# en caliente instantanea. Las imagenes reales de produccion las construye
# Dokploy a partir de los Dockerfiles (issue #6).
#
#   docker compose up -d       levantar
#   docker compose down        detener
#   docker compose down -v     detener y BORRAR los datos
# ---------------------------------------------------------------------------

name: voxia

services:
  postgres:
    image: postgres:17-alpine
    container_name: voxia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
      POSTGRES_DB: ${POSTGRES_DB:-voxia}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-voxia_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-cambiar_en_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxia} -d ${POSTGRES_DB:-voxia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: voxia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Captura todo el correo saliente en desarrollo: nada sale a internet.
  # Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: voxia-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  redis_data:
