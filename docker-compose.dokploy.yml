# Stack de VoxIA Control para desplegar EN DOKPLOY.
#
# Por que existe este archivo y no reusamos docker-compose.production.yml:
# aquel trae su propio Traefik en los puertos 80 y 443, que es exactamente
# donde ya escucha el Traefik de Dokploy. Los dos no pueden convivir.
#
#   docker-compose.yml             -> desarrollo local (postgres, redis, mailpit)
#   docker-compose.production.yml  -> VPS pelado, sin Dokploy, con su propio Traefik
#   docker-compose.dokploy.yml     -> este: Dokploy pone el proxy, el TLS y el dominio
#
# En Dokploy, `api` y `web` se publican asignandoles un dominio desde la
# pestaña Domains del servicio. Por eso estan en `dokploy-network`, que es la
# red externa que crea Dokploy. `postgres` y `redis` NO estan ahi a proposito:
# no se exponen a internet nunca.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Los lee 01-app-role.sh para crear el rol de la aplicacion.
      DATABASE_APP_USER: ${DATABASE_APP_USER}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # CRITICO: aca vive 01-app-role.sh, que crea voxia_app sin BYPASSRLS y
      # aborta el arranque si el rol quedara con ese privilegio. Una base creada
      # sin este montaje pierde la unica verificacion del aislamiento entre
      # empresas. No lo quites.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  # Dump diario de PostgreSQL (issue #24, ver docs/respaldos.md).
  # SIN perfil a proposito: el respaldo no es opcional, corre igual en staging
  # y en produccion. Solo red interna: no expone nada.
  # OJO: los dumps quedan en el MISMO disco que la base (volumen backup_data);
  # la copia fuera del VPS esta pendiente de decidir (BACKUP_REMOTE en
  # .env.example y docs/respaldos.md).
  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # tzdata viene en la imagen; sin TZ el "04:00" seria UTC.
      TZ: America/Santiago
      PGHOST: postgres
      # Dueño de la base, no voxia_app: el rol de la app no ve nada sin
      # contexto de tenant (RLS falla cerrada) y el dump saldria vacio.
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    # La imagen de postgres ejecuta cualquier comando que no sea `postgres`
    # tal cual, asi que este contenedor nunca levanta un servidor propio.
    command:
      - sh
      - -c
      - |
        set -u
        echo "[backup] servicio arriba; dump diario 04:00 America/Santiago, retencion $${BACKUP_RETENTION_DAYS} dias"
        while true; do
          objetivo=$$(date -d "$$(date +%F) 04:00" +%s)
          ahora=$$(date +%s)
          [ "$$objetivo" -le "$$ahora" ] && objetivo=$$((objetivo + 86400))
          espera=$$((objetivo - ahora))
          echo "[backup] proximo dump en $$espera segundos"
          sleep "$$espera"
          fecha=$$(date +%F)
          destino=/backups/voxia-$$fecha.dump
          inicio=$$(date +%s)
          echo "[backup] inicio pg_dump $$fecha"
          if pg_dump -Fc -f "$$destino.part" "$$PGDATABASE"; then
            mv "$$destino.part" "$$destino"
            echo "[backup] ok: $$destino ($$(du -h "$$destino" | cut -f1)) en $$(( $$(date +%s) - inicio ))s"
          else
            rm -f "$$destino.part"
            echo "[backup] ERROR: pg_dump fallo; queda el dump anterior y se reintenta a las 04:00 siguientes" >&2
          fi
          find /backups -name 'voxia-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
        done
    volumes:
      - backup_data:/backups
      # restore.sh montado aca para poder correrlo con `docker compose exec`.
      - ./docker/postgres/backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # Corre las migraciones (como dueño del esquema, via MIGRATION_DATABASE_URL)
    # y recien despues arranca la API. Con una sola replica esto es seguro; si
    # algun dia hay varias, las migraciones pasan a un paso de deploy aparte
    # para que no corran en paralelo.
    command:
      - sh
      - -c
      - >-
        node node_modules/typeorm/cli.js migration:run
        -d apps/api/dist/database/data-source.js
        && { [ "$$RUN_DEMO_SEED" != "true" ]
        || node apps/api/dist/database/seeds/development.js; }
        && exec node apps/api/dist/main.js
    environment:
      # staging valida distinto que production (permite mailpit, exige igual
      # secretos reales). Cada proyecto de Dokploy fija el suyo.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      # CORS y proteccion CSRF validan contra este origen: debe ser el dominio
      # real del panel o el login desde el navegador se rechaza.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      # Las fotos viven en un volumen persistente: sin esto un redeploy las pierde.
      EVIDENCE_PATH: /data/evidence
      MAILPIT_HOST: ${MAILPIT_HOST:-localhost}
      MAILPIT_PORT: ${MAILPIT_PORT:-1025}
      # Cuentas demo al arrancar (solo staging; el seed se niega en production
      # y es idempotente: re-arrancar no duplica nada)
      RUN_DEMO_SEED: ${RUN_DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DATABASE_ADMIN_URL: ${MIGRATION_DATABASE_URL}
      # La aplicacion en runtime: sin permiso para crear ni alterar tablas.
      DATABASE_URL: ${DATABASE_URL}
      # Las migraciones usan al dueño del esquema, no al rol de la app.
      # Si las dos apuntaran al mismo rol, el primer CREATE TABLE falla con
      # "permission denied for schema public".
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      MAIL_DRIVER: ${MAIL_DRIVER}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: ${SMTP_SECURE}
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - dokploy-network

  # Bandeja de correo de PRUEBAS: captura todo, nada sale a internet.
  # Solo existe con COMPOSE_PROFILES=staging; produccion usa SMTP real.
  # UI en el dominio de staging bajo /correo.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    profiles: ["staging"]
    environment:
      MP_WEBROOT: /correo
      # Con el sitio publico, la bandeja de pruebas no puede quedar abierta a
      # internet: usuario:clave (formato user:pass). Vacio = sin candado (local).
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    networks:
      - internal
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # El middleware valida la sesion contra la API por la red interna de
      # Docker (no pasa por el proxy ni por internet). Sin esto, el middleware
      # no puede resolver el rol y rebota al login aunque las credenciales
      # sean correctas.
      API_INTERNAL_URL: http://api:3001/api
      WEB_ORIGIN: ${WEB_PUBLIC_URL:-http://localhost:3000}
      MAP_TILE_URL: ${MAP_TILE_URL:?Configura un proveedor de mapas, no los tiles publicos de OSM}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network

networks:
  # La crea Dokploy al instalarse. `external` significa "ya existe, no la crees".
  dokploy-network:
    external: true
  # Sin salida a internet: aca viven postgres y redis.
  internal:

volumes:
  evidence_data:
  postgres_data:
  redis_data:
  backup_data:
