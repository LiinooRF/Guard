server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sin esto, /control-de-rondas-nfc/ (sin barra final) responde 301 hacia
  # http://, y detras de un proxy con TLS eso es una redireccion a texto plano.
  absolute_redirect off;

  charset utf-8;
  gzip on;
  gzip_types text/plain text/css application/xml image/svg+xml application/json;
  gzip_min_length 512;

  # Cabeceras de seguridad. La landing no tiene formularios ni sesion, asi que
  # la politica puede ser estricta sin romper nada: solo se permiten las fuentes
  # de Google, que es lo unico externo que carga.
  #
  # NINGUN `location` de aca abajo puede tener su propio `add_header`: en nginx
  # el nivel mas interno REEMPLAZA la lista heredada, no la suma. La primera
  # version fijaba Cache-Control con add_header dentro de los location y eso
  # dejaba a la landing sirviendose sin CSP y sin X-Frame-Options, en silencio.
  # Por eso el cacheo se resuelve solo con `expires`, que es otra directiva y
  # no pisa nada.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

  # Las capturas y el CSS cambian con el deploy; el HTML NO se cachea largo
  # porque es lo que se corrige a mano.
  location ~* \.(png|ico|svg|css)$ { expires 30d; }
  location ~* \.(html|txt|xml)$    { expires 10m; }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  access_log off;
}
