name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voxia
          POSTGRES_PASSWORD: cambiar_en_ci
          POSTGRES_DB: voxia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxia -d voxia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://voxia:cambiar_en_ci@localhost:5432/voxia
      DATABASE_TEST_URL: postgresql://voxia:cambiar_en_ci@localhost:5432/voxia
      DATABASE_APP_TEST_URL: postgresql://voxia_app:cambiar_app_en_ci@localhost:5432/voxia
      DATABASE_ADMIN_URL: postgresql://voxia:cambiar_en_ci@localhost:5432/voxia
      REDIS_URL: redis://localhost:6379
      REDIS_TEST_URL: redis://localhost:6379
      JWT_SECRET: secreto-exclusivo-de-ci-con-mas-de-32-caracteres
      # Datos efímeros: la base del runner se destruye al terminar el job.
      DEMO_PASSWORD: DemoGuardia2026!

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear rol restringido y migrar PostgreSQL
        env:
          PGPASSWORD: cambiar_en_ci
        run: |
          psql -h localhost -U voxia -d voxia -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE voxia_app LOGIN PASSWORD 'cambiar_app_en_ci'
            NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT USAGE ON SCHEMA public TO voxia_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO voxia_app;
          SQL
          npm run db:migrate --workspace @voxia/api

      - name: Cargar datos aislados de prueba
        env:
          DATABASE_URL: postgresql://voxia_app:cambiar_app_en_ci@localhost:5432/voxia
        run: npm run seed --workspace @voxia/api

      # shared se compila primero: api y web importan sus tipos.
      - name: Compilar @voxia/shared
        run: npm run build --workspace @voxia/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  compose:
    name: validar docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Validar la sintaxis del compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml es valido"

      - name: Validar el compose de produccion
        env:
          POSTGRES_USER: voxia
          POSTGRES_PASSWORD: validation-only
          POSTGRES_DB: voxia
          DATABASE_APP_USER: voxia_app
          DATABASE_APP_PASSWORD: validation-app-only
          REDIS_PASSWORD: validation-redis-only
          JWT_SECRET: validation-secret-with-more-than-48-characters
          MAIL_FROM: VoxIA <no-reply@example.test>
          SMTP_HOST: smtp.example.test
          SMTP_USER: validation
          SMTP_PASSWORD: validation-only
          APP_DOMAIN: control.example.test
          ACME_EMAIL: operations@example.test
        run: docker compose -f docker-compose.production.yml config --quiet

  secrets:
    name: historial sin secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Escanear el historial completo
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner

  mobile:
    name: shell Android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependencias aisladas
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Validar configuracion Android de produccion
        env:
          NODE_ENV: production
          EXPO_PUBLIC_WEB_URL: https://control.example.test
        run: npx expo config --type public --json >/dev/null

  images:
    name: imagen ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: web
            dockerfile: Dockerfile.web

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen de ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
